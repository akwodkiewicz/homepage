<style>
:root{--ink:#1a1917;--accent:#4a5f4e;--paper:#f7f6f8;--photo:flex;--ph-zoom:1.15;--ph-x:0%;--ph-y:0%}
html,body{margin:0;min-height:100%;background:var(--paper);font-family:'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--accent)}
.ph{position:relative;overflow:hidden;background-color:rgba(26,25,23,.05);display:var(--photo)}
.ph::before{content:'';position:absolute;inset:0;background-image:url('./portrait.jpg');background-size:cover;background-position:var(--ph-x) var(--ph-y);transform:scale(var(--ph-zoom));transform-origin:var(--ph-x) var(--ph-y)}
.lbl{font:500 9.5px/1 'Public Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(26,25,23,.55);padding:0 4px 9px}
.grp{display:flex;flex-direction:column;border-top:1px solid rgba(26,25,23,.14)}
.pg{padding:12px 4px;border-bottom:1px solid rgba(26,25,23,.09);font:400 15px/1.3 'Public Sans',sans-serif}
.pg:last-child{border-bottom:none}
.so{display:flex;flex-direction:column;gap:3px;padding:11px 4px;border-bottom:1px solid rgba(26,25,23,.09)}
.so:last-child{border-bottom:none}
.so-k{font:500 9.5px/1 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(26,25,23,.5)}
.so-v{font:400 14px/1.2 'Public Sans',sans-serif}

    <div class="ph" style="width:72px;height:72px;border-radius:20px;flex:none" role="img" aria-label="Portrait of Andrzej Wódkiewicz"></div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <h1 style="margin:0;font:400 clamp(24px,5.2vw,32px)/1.06 'Poppins',sans-serif;letter-spacing:-.015em;color:var(--ink)">Andrzej Wódkiewicz</h1>
      <p style="margin:0;font:400 11px/1.5 'Public Sans',sans-serif;letter-spacing:.15em;text-transform:uppercase;color:rgba(26,25,23,.45)">Product builder · Software developer</p>
    </div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:28px 52px;align-items:flex-start;width:100%;max-width:440px">
    <nav style="display:flex;flex-direction:column;flex:1 1 150px;min-width:150px">
      <div class="lbl">Pages</div>
      <div class="grp">
        <a href="#" class="pg">Blog</a>
        <a href="#" class="pg">/now</a>
        <a href="#" class="pg">Projects</a>
      </div>
    </nav>
    <div style="display:flex;flex-direction:column;flex:1 1 200px;min-width:200px">
      <div class="lbl">Elsewhere</div>
      <div class="grp">
        <a href="https://github.com/akwodkiewicz" class="so" rel="me"><span class="so-k">GitHub</span><span class="so-v">@akwodkiewicz</span></a>
        <a href="https://twitter.com/vutkyevitch" class="so" rel="me"><span class="so-k">Twitter</span><span class="so-v">@vutkyevitch</span></a>
        <a href="https://www.linkedin.com/in/andrzej-w" class="so" rel="me"><span class="so-k">LinkedIn</span><span class="so-v">andrzej-w</span></a>
        <a href="mailto:andrzej@wodkiewi.cz" class="so"><span class="so-k">Email</span><span class="so-v">andrzej@wodkiewi.cz</span></a>
      </div>
    </div>
